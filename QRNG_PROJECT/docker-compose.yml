version: "3.9"

# Local development stack mirroring production Cloud Run + Cloud SQL topology.
# Usage: docker compose up --build

services:
  # ── PostgreSQL (mirrors Cloud SQL in production) ────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: qrng_db
      POSTGRES_USER: qrng_user
      POSTGRES_PASSWORD: qrng_local_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrng_user -d qrng_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend (same image used in Cloud Run) ──────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgresql+psycopg2://qrng_user:qrng_local_dev@db:5432/qrng_db"
      ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    depends_on:
      db:
        condition: service_healthy

  # ── Next.js Frontend (dev server only — production goes to Cloudflare Pages) ─
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend

volumes:
  postgres_data:
